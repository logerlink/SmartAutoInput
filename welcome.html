<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎使用智能表单数据模拟助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .features {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .quick-start {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .step {
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎉</div>
        <h1>欢迎使用智能表单数据模拟助手</h1>
        <div class="subtitle">
            专为前端开发测试设计的智能表单填充工具<br>
            一键生成真实可用的测试数据，提升开发效率
        </div>
        
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>完美兼容 Vue2/Vue3/原生JS 框架</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>智能识别 20+ 种表单输入类型</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>支持悬浮窗、右键菜单、快捷键操作</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>生成真实可用的测试数据</span>
            </div>
        </div>
        
        <div class="quick-start">
            <h3>快速开始</h3>
            <div class="step">1. 打开任意包含表单的网页</div>
            <div class="step">2. 点击页面右上角的绿色悬浮窗</div>
            <div class="step">3. 选择"重新填充"或"重复填充"</div>
            <div class="step">4. 或者在输入框右键选择具体数据类型</div>
            <a href="#" class="btn" onclick="window.close()">开始使用</a>
        </div>
        
        <div class="footer">
            v1.0.0 | 祝您使用愉快！
        </div>
    </div>
</body>
</html>
